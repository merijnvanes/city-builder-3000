# Every push. Fast enough to wait for, so it holds the things that must never be
# wrong and can be decided without a browser: the simulation, the art contract,
# and a build that produces a deployable site.
#
# The Chrome suites are not here. They need a browser and a server and take
# minutes, and they answer a different question — how the game looks and
# behaves — which is worth knowing every night rather than every commit. See
# nightly.yml.
#
# The deploy lives here too, as a second job gated on the first. It is the same
# question asked once: the tests below decide whether main is good, and there is
# no version of "good enough to keep" that differs from "good enough to serve".
# Split into its own workflow it would have to either re-run this whole suite or
# race it, and racing it means a push that breaks the simulation reaches
# citybuilder.mulletiq.com before anything notices.
#
# Every action is pinned to a commit SHA, with its version in the comment beside
# it, and the first step of `test` fails the build if one ever goes back to a tag.
#
# A tag is a moving reference: whoever can push to the action's repository can
# point v7 at different code. Only the Cloudflare step is handed
# CLOUDFLARE_API_TOKEN, so a moved tag elsewhere does not receive it directly,
# but every step in the deploy job shares one runner and an earlier one can
# rewrite what a later one does. The token is account-scoped and can edit
# Workers and Workers Routes on the zone that also serves mulletiq.com, so the
# blast radius of that reaches well past this game.
#
# `persist-credentials: false` on each checkout keeps the job's GITHUB_TOKEN out
# of the repository's git config, where the install and build steps would be
# able to read it. Nothing here pushes, so nothing needs it.
#
# Two things to get right when bumping one.
#
# Resolve the tag to a commit rather than reading it off the tag ref.
# `gh api repos/<owner>/<repo>/git/ref/tags/v7` answers with a tag object for an
# annotated tag, and that object's SHA is not a commit: pnpm/action-setup is
# annotated, and pinning its tag SHA fails the run. Dereference it with
# `gh api repos/<owner>/<repo>/git/tags/<sha> --jq '.object.sha'`, which is the
# commit, and check it with `gh api repos/<owner>/<repo>/commits/<sha>`.
#
# Pin a release whose `action.yml` says `using: node24`. GitHub removes the
# Node 20 runtime from the runners on 23 September 2026, and an action still
# declaring node20 has no runtime to start on. Pinning freezes that choice,
# which a floating major tag would have quietly moved for us.
name: CI

on:
  push:
  pull_request:

concurrency:
  # A push to a branch with an open pull request triggers this workflow twice,
  # under two different refs. head_ref names the branch in the pull-request case,
  # so both land in one group and the duplicate is cancelled.
  #
  # Runs on the default branch are left alone: each merge is a distinct thing to
  # know about, and cancelling the previous one loses that answer.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First, and before anything is installed or run. The comment at the top of
      # this file is the reasoning; a comment alone does not survive somebody
      # tidying a SHA back to a readable tag, and the tidied version looks like an
      # improvement in a diff. Local actions (./path) are exempt, since they are
      # this repository's own code and already move with the commit.
      - name: Actions are pinned to commit SHAs
        run: |
          loose=$(grep -rhE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ \
            | sed 's/.*uses:[[:space:]]*//' \
            | grep -v '^\./' \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$loose" ]; then
            echo "not pinned to a commit SHA:"
            echo "$loose"
            echo "see the note at the top of .github/workflows/ci.yml"
            exit 1
          fi
          echo "every action is pinned"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Pinned, not floating on 11.x: an install is not the place to find out
          # a patch release changed its mind about something.
          version: 11.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # pnpm-workspace.yaml allows esbuild's postinstall, which pnpm 11 would
      # otherwise refuse to run and fail the install over.
      - run: pnpm install --frozen-lockfile

      # Before the tests, not after: tests/deploy-headers.test.js checks every
      # file in a finished build against public/_headers, and skips itself when
      # there is no build to look at.
      - name: Build
        run: pnpm build

      - name: Check the build produced a deployable site
        run: |
          test -f dist/index.html || { echo "no index.html in dist"; exit 1; }
          test -f dist/_headers || { echo "no _headers in dist: the deploy would have no cache or security policy"; exit 1; }
          test -f dist/sw.js || { echo "no sw.js in dist"; exit 1; }
          test -f dist/boot.css || { echo "no boot.css in dist: the loading screen would be unstyled"; exit 1; }

      - name: Test
        run: pnpm test

      # No browser, half a second, and it guards the sprite manifest the whole
      # game reads. It belongs where a pull request can see it fail.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install "pillow==11.3.0"

      - name: Art contract
        run: pnpm test:art-contract

  # Only main, only a real push, and only behind a green `test`. A pull request
  # reaches this job with the ref of a branch nobody has merged, so the event is
  # checked as well as the ref.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One deploy at a time, and never cancelled halfway. wrangler uploads the
    # 5,588 files of artwork before it moves the live version onto them, so a
    # run killed in the middle leaves the upload half done and the next one
    # repeats the whole thing.
    concurrency:
      group: deploy-citybuilder
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Built again rather than carried from `test` as an artifact. The build is
      # two seconds and reproducible; uploading and downloading 91 MB of sprites
      # to save it would cost more than it saves, and it would put a copy of the
      # artwork through a second system that can go wrong on its own.
      - name: Build
        run: pnpm build

      # The account is named in wrangler.jsonc, so the token is the only secret
      # this needs. wrangler is a devDependency here, which pins the version the
      # deploy runs on instead of letting the action pick one.
      - name: Deploy to citybuilder.mulletiq.com
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: deploy
