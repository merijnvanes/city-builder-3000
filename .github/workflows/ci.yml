# Every push. Fast enough to wait for, so it holds the things that must never be
# wrong and can be decided without a browser: the simulation, the art contract,
# and a build that produces a deployable site.
#
# The Chrome suites are not here. They need a browser and a server and take
# minutes, and they answer a different question — how the game looks and
# behaves — which is worth knowing every night rather than every commit. See
# nightly.yml.
#
# The deploy lives here too, as a second job gated on the first. It is the same
# question asked once: the tests below decide whether main is good, and there is
# no version of "good enough to keep" that differs from "good enough to serve".
# Split into its own workflow it would have to either re-run this whole suite or
# race it, and racing it means a push that breaks the simulation reaches
# citybuilder.mulletiq.com before anything notices.
name: CI

on:
  push:
  pull_request:

concurrency:
  # A push to a branch with an open pull request triggers this workflow twice,
  # under two different refs. head_ref names the branch in the pull-request case,
  # so both land in one group and the duplicate is cancelled.
  #
  # Runs on the default branch are left alone: each merge is a distinct thing to
  # know about, and cancelling the previous one loses that answer.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned, not floating on 11.x: an install is not the place to find out
          # a patch release changed its mind about something.
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm-workspace.yaml allows esbuild's postinstall, which pnpm 11 would
      # otherwise refuse to run and fail the install over.
      - run: pnpm install --frozen-lockfile

      # Before the tests, not after: tests/deploy-headers.test.js checks every
      # file in a finished build against public/_headers, and skips itself when
      # there is no build to look at.
      - name: Build
        run: pnpm build

      - name: Check the build produced a deployable site
        run: |
          test -f dist/index.html || { echo "no index.html in dist"; exit 1; }
          test -f dist/_headers || { echo "no _headers in dist: the deploy would have no cache or security policy"; exit 1; }
          test -f dist/sw.js || { echo "no sw.js in dist"; exit 1; }
          test -f dist/boot.css || { echo "no boot.css in dist: the loading screen would be unstyled"; exit 1; }

      - name: Test
        run: pnpm test

      # No browser, half a second, and it guards the sprite manifest the whole
      # game reads. It belongs where a pull request can see it fail.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install "pillow==11.3.0"

      - name: Art contract
        run: pnpm test:art-contract

  # Only main, only a real push, and only behind a green `test`. A pull request
  # reaches this job with the ref of a branch nobody has merged, so the event is
  # checked as well as the ref.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One deploy at a time, and never cancelled halfway. wrangler uploads the
    # 5,588 files of artwork before it moves the live version onto them, so a
    # run killed in the middle leaves the upload half done and the next one
    # repeats the whole thing.
    concurrency:
      group: deploy-citybuilder
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Built again rather than carried from `test` as an artifact. The build is
      # two seconds and reproducible; uploading and downloading 91 MB of sprites
      # to save it would cost more than it saves, and it would put a copy of the
      # artwork through a second system that can go wrong on its own.
      - name: Build
        run: pnpm build

      # The account is named in wrangler.jsonc, so the token is the only secret
      # this needs. wrangler is a devDependency here, which pins the version the
      # deploy runs on instead of letting the action pick one.
      - name: Deploy to citybuilder.mulletiq.com
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: deploy
